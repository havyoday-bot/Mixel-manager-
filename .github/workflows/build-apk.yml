name: Build Mixel APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generate Mixel icon and splash
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Android permissions for file export
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>#' "$MANIFEST"
          fi
          if ! grep -q "requestLegacyExternalStorage" "$MANIFEST"; then
            sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' "$MANIFEST"
          fi

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mixel.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mixel-APK
          path: Mixel.apk
